<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Empresa · Zona Privada</title>
  <style>
    :root {
      --bg: #f4f7f9;
      --card: #ffffff;
      --text: #1b2430;
      --muted: #5a6778;
      --ok-bg: #ecfdf5;
      --ok-text: #065f46;
      --ok-border: #a7f3d0;
      --border: #dce4ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    header {
      background: #0f172a;
      color: #f8fafc;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-weight: 700; font-size: 1.15rem; }
    main { max-width: 760px; margin: 2.5rem auto; padding: 0 1.25rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    }
    .alert {
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid var(--ok-border);
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }
    p { color: var(--muted); }
    a { color: #0f766e; font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="brand">empresa.local / privado</div>
    <span>Área autenticada</span>
  </header>
  <main>
    <div class="card">
      <div class="alert">Acceso concedido mediante usuario y contraseña sobre conexión HTTPS.</div>
      <h1>Zona Privada de Empresa</h1>
      <p>Esta sección está restringida exclusivamente a usuarios autorizados en el servidor Apache (AuthType Basic sobre TLS).</p>
      <p><a href="/">← Volver al portal público</a></p>
    </div>
  </main>
</body>
</html>
