<VirtualHost *:80>
    ServerName empresa.local
    ServerAlias www.empresa.local
    Redirect permanent / https://empresa.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName empresa.local
    ServerAlias www.empresa.local
    DocumentRoot /var/www/empresa.local/html

    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCertificateFile /etc/ssl/certs/empresa.local.crt
    SSLCertificateKeyFile /etc/ssl/private/empresa.local.key

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    <Directory /var/www/empresa.local/html>
        Require all granted
        Options -Indexes
    </Directory>

    <Directory /var/www/empresa.local/html/privado>
        AuthType Basic
        AuthName "Zona privada de Empresa"
        AuthUserFile /etc/apache2/empresa.htpasswd
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/empresa.local-error.log
    CustomLog ${APACHE_LOG_DIR}/empresa.local-access.log combined
</VirtualHost>
